name: Build Docker containers
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push ${{ matrix.name }} Docker container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: client
            context: ./client
            platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
            extra_build_args: --build-arg BUILD_INFO=docker-latest
          - name: server
            context: ./server
            platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
            extra_build_args: ""
          - name: embedder
            context: ./embedder
            # PyTorch does not publish linux/arm/v7 wheels
            platforms: linux/amd64,linux/arm64/v8
            extra_build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine metadata
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${REGISTRY}/${OWNER_LC}/szurubooru-${{ matrix.name }}"
          DATE_TAG="$(date -u +'%Y.%m.%d')"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "date_tag=${DATE_TAG}" >> $GITHUB_ENV
          echo "build_date=${BUILD_DATE}" >> $GITHUB_ENV
          echo "repo_url=${{ github.server_url }}/${{ github.repository }}" >> $GITHUB_ENV

          echo "Image: ${IMAGE_NAME}"
          echo "Date tag: ${DATE_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container
        run: >
          docker buildx build --push
          --platform ${{ matrix.platforms }}
          --build-arg BUILD_DATE=${{ env.build_date }}
          --build-arg SOURCE_COMMIT=${{ github.sha }}
          --build-arg DOCKER_REPO=${{ env.image_name }}
          --build-arg REPO_URL=${{ env.repo_url }}
          ${{ matrix.extra_build_args }}
          -t "${{ env.image_name }}:latest"
          -t "${{ env.image_name }}:${{ env.date_tag }}"
          ${{ matrix.context }}
